<!DOCTYPE html>
<html>
<head>
    <title>Outfit Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffe6f0;
            color: #a3005e;
            text-align: center;
            padding: 50px;
        }
        select, button {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>💖 Choose Your Dress Code</h1>
    <form method="POST">
        <select name="dress_code" class="form-select w-50 mx-auto">
            <option value="cocktail">Cocktail</option>
            <option value="corporate">Corporate</option>
        </select>
        <br>
        <button class="btn btn-pink btn-lg" style="background-color: #ff66b2; color: white;">Get Outfit</button>
    </form>
</body>
</html>
