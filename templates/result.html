<!DOCTYPE html>
<html>
<head>
    <title>Outfit Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fff0f5;
            color: #c71585;
            padding: 30px;
        }
        .item {
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            background-color: #ffe6f0;
            width: 80%;
            box-shadow: 0 4px 8px rgba(255, 105, 180, 0.2);
        }
        .item img {
            width: 150px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1 class="text-center">💄 {{ dress_code.capitalize() }} Outfit</h1>
    <div class="container">
        {% for item in outfit %}
            <div class="item d-flex align-items-center justify-content-start gap-4">
                <img src="{{ item.image }}" alt="{{ item.name }}">
                <div>
                    <h4>{{ item.name }}</h4>
                    <p><em>{{ item.category }}</em></p>
                </div>
            </div>
        {% endfor %}
    </div>
    <div class="text-center mt-4">
        <a href="/" class="btn btn-outline-pink" style="color: #d63384;">⬅️ Choose Again</a>
    </div>
</body>
</html>
